version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
    depends_on:
      - auth-service
      - tools-service

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    volumes:
      - ./services/frontend:/usr/src/frontend

  auth-service:
    container_name: auth-service
    build:
      context: ./services/auth-service
      dockerfile: Dockerfiles/Dockerfile
    depends_on:
      - db-auth
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
    volumes:
      - ./services/auth-service:/usr/src/auth-service
    working_dir: /usr/src/auth-service
  #    ports:   // commented out in order not to expose for reaching externally
  #      - 8083:8080

  db-auth:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  tools-service:
    container_name: tools-service
    build:
      context: ./services/tools-service
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./services/tools-service:/app
      - ./services/tools-service/gradle:/app/gradle
      - ./services/tools-service/build:/app/build
    environment:
      - DEBUG_PORT=9090
  #    ports:   // commented out in order not to expose for reaching externally
  #      - 8084:8080

  notification-service:
    container_name: notification-service
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    depends_on:
      - db-users
    environment:
      - POSTGRES_USER=${USER_DB_USER}
      - POSTGRES_PASSWORD=${USER_DB_PASSWORD}
      - POSTGRES_DB=${USER_DB_NAME}
      - POSTGRES_HOST=db-users
    volumes:
      - ./services/notification-service:/usr/src/notification-service
    working_dir: /usr/src/notification-service
    ports:
      - 8085:8080  # Uncomment if you want to expose it externally

  db-notification:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: users
    ports:
      - "5433:5432"
    volumes:
      - pgdata-notification:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
  pgdata-notification:
    driver: local