worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
#     default_type application/json;
#     client_max_body_size 1G;
#
#     client_header_buffer_size   128k;
#     large_client_header_buffers 100 256k;
#
#     gzip                        on;
#     gzip_comp_level             2;
#     gzip_vary                   on;
#     gzip_min_length             1;
#     gzip_proxied                any;
#     gzip_types                  text/plain
#                                 text/css
#                                 application/x-javascript
#                                 text/xml
#                                 application/xml
#                                 application/xml+rss
#                                 text/javascript
#                                 application/javascript
#                                 application/json;
#     gzip_buffers                32 1024k;
#     server_names_hash_max_size  2048;
#     server_names_hash_bucket_size 512;
#     postpone_output             1460;
#
#
#     sendfile                    on;
#     tcp_nopush                  on;
#     tcp_nodelay                 on;
#
#     keepalive_timeout           75 20;
#     charset                     utf-8;
#
#     client_header_timeout           10;
#     client_body_timeout             10;
#     output_buffers                  8 512k;
#     lingering_time                  30;
#     lingering_timeout               6;

    upstream auth-service {
        server auth-service:8080;
    }

    upstream tools-service {
        server tools-service:8080;
    }

    log_format request_body_log '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" "$request_body"';

    access_log /var/log/nginx/request_body.log request_body_log;

    server {
        listen 80;
        server_name gy-inv.local;
        client_max_body_size 1G;

        location /auth/ {
            proxy_pass http://auth-service/;
            proxy_http_version 1.1;

            proxy_buffering off;
            proxy_request_buffering off;
            client_max_body_size 1G;

            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
            proxy_busy_buffers_size 16k;

            proxy_set_header content-type application/json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Content-Length $content_length;

            proxy_set_header Accept-Encoding "";
            gzip off;
        }

        location /tools/ {
            proxy_pass http://tools-service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://auth-service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}